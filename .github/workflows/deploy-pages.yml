# Build the MA 124 copy of APEX Calculus and publish it to GitHub Pages.
#
#   * pull request        -> build only (proves the book still builds)
#   * push to main        -> build and deploy
#   * workflow_dispatch   -> build and deploy (manual run)
#
# The book is built on the Ubuntu runner with Debian's TeX Live packages,
# the same set that built it locally, and the CLI pinned by
# requirements.txt.  (The first run used the oscarlevin/pretext-full
# container: its minimal TinyTeX lacks packages APEX's latex-image
# preamble loads, so every TikZ image failed.)  The WeBWorK exercises
# come from the server named in publication/publication-ma124.ptx.
name: Build and deploy APEX Calculus (MA 124)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node (PreTeXt builds its CSS with it)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TeX, Asymptote and the image converters
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-pictures texlive-science \
            texlive-fonts-recommended fonts-lmodern asymptote dvisvgm pdf2svg \
            poppler-utils ghostscript
          xelatex --version | head -1
          asy -version 2>&1 | head -1

      - name: Install the pinned PreTeXt CLI
        run: |
          pip install -r requirements.txt
          pretext --version

      - name: Use the CLI's bundled Runestone services
        # pretext 2.49.1 parses the live Runestone services file with
        # ET.fromstring() on a str, which lxml refuses now that the file
        # declares its encoding ("Unicode strings with encoding declaration
        # are not supported"; fixed upstream in 2.56.1).  Seed the cache
        # file the CLI falls back to, and make runestone.academy unreachable
        # for the build, so the CLI uses the Runestone services it ships
        # with, as an offline build does.  Drop this step when the pin
        # reaches 2.56.1 or later.
        run: |
          python - <<'PY'
          from pretext import resources
          cache = resources.resource_base_path() / "rs_cache"
          src, dst = cache / "runestone_services.xml", cache / "rs_services.xml"
          if not dst.exists():
              dst.write_text(src.read_text())
          print("Runestone services cache:", dst, sorted(p.name for p in cache.iterdir()))
          PY
          echo "127.0.0.1 runestone.academy" | sudo tee -a /etc/hosts

      - name: Build the book
        shell: bash
        run: |
          set -o pipefail
          if ! pretext build ma124 2>&1 | { grep -v 'asset directories' || true; }; then
            echo "::group::LaTeX diagnostics (debug re-run)"
            pretext build ma124 -v debug 2>&1 \
              | sed -E 's/\x1b\[[0-9;]*m//g; s/^(debug|info|warning|error): +//' \
              | grep -E '^! |^l\.[0-9]+ |LaTeX Error|Emergency stop|not found' \
              | awk '!seen[$0]++' | head -40 || true
            echo "::endgroup::"
            exit 1
          fi
          test -f output/ma124/index.html \
            || { echo "::error::the build produced no output/ma124/index.html"; exit 1; }
          echo "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC')" \
            > output/ma124/build-info.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/ma124

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
